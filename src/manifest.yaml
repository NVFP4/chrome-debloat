policyGroups:
  chromiumExt:
    label: Extensions
    targets: [ chrome, brave, edge, chromium ]
    settings:
      ExtensionInstallForcelist: []
  braveTelemetry:
    label: Brave Telemetry
    targets: [ brave ]
    settings:
      BraveP3AEnabled: false
      BraveStatsPingEnabled: false
  braveFeatures:
    label: Brave Features
    targets: [ brave ]
    settings:
      BraveAIChatEnabled: false
      BraveNewsDisabled: true
      BravePlaylistEnabled: false
      BraveRewardsDisabled: true
      BraveSpeedreaderEnabled: false
      BraveSyncUrl: ""
      BraveTalkDisabled: true
      BraveVPNDisabled: true
      BraveWalletDisabled: true
      BraveWaybackMachineEnabled: false
      BraveWebDiscoveryEnabled: false
      TorDisabled: true
  edgeTelemetry:
    label: Edge Telemetry
    targets: [ edge ]
    settings:
      ConfigureDoNotTrack: true
      DiagnosticData: 0
      Edge3PSerpTelemetryEnabled: false
      ExperimentationAndConfigurationServiceControl: 0
      PersonalizationReportingEnabled: false
      UrlDiagnosticDataEnabled: false
  edgeSignIn:
    label: Edge Sign In
    targets: [ edge ]
    settings:
      EdgeBlockSignInEnabled: true
      ImplicitSignInEnabled: false
      M365AuthPopupsInWorkEnabled: false
      SeamlessWebToBrowserSignInEnabled: false
      WebToBrowserSignInEnabled: false
  edgeGenAI:
    label: Edge Copilot
    targets: [ edge ]
    settings:
      EdgeCopilotEnabled: false
      Microsoft365CopilotChatIconEnabled: false
      CopilotNewTabPageEnabled: false
      ShareBrowsingHistoryWithCopilotSearchAllowed: false
      AllowBrowsingWithCopilot: false
      M365LinksAutoOpenCopilotEnabled: false
      ComposeInlineEnabled: false
      AIGenThemesEnabled: false
      EdgeHistoryAISearchEnabled: false
      CopilotAddressBarSuggestionsEnabled: false
      CopilotCoworkToolActionsEnabled: false
  edgeFeatures:
    label: Edge Features
    targets: [ edge ]
    settings:
      # Accessibility
      LiveCaptionsAllowed: false
      AccessibilityImageLabelsEnabled: false
      # Address Bar
      AddressBarTrendingSuggestEnabled: false
      # Application Guard
      ApplicationGuardFavoritesSyncEnabled: false
      ApplicationGuardPassiveModeEnabled: false
      ApplicationGuardTrafficIdentificationEnabled: false
      ApplicationGuardUploadBlockingEnabled: false
      # Edge Typo Protection
      TyposquattingCheckerEnabled: false
      # Edge Workspaces
      EdgeWorkspacesEnabled: false
      # Extensions
      ControlDefaultStateOfAllowExtensionFromOtherStoresSettingEnabled: true
      # SmartScreen
      SmartScreenDnsRequestsEnabled: false
      SmartScreenEnabled: false
      SmartScreenForTrustedDownloadsEnabled: false
      SmartScreenPuaEnabled: false
      # Scareware
      ScarewareBlockerProtectionEnabled: false
      ScarewareBlockerBlocksDetectedSitesEnabled: false
      ScarewareBlockerSendDetectedSitesToSmartScreenEnabled: false
      # Internet Explorer
      InternetExplorerIntegrationLevel: 0
      # Manageability
      EdgeManagementEnabled: false
      EdgeManagementExtensionsFeedbackEnabled: false
      # Microsoft Office
      QuickViewOfficeFilesEnabled: false
      # New tab page
      NewTabPageAllowedBackgroundTypes: 3
      NewTabPageAppLauncherEnabled: false
      NewTabPageBingChatEnabled: false
      NewTabPageContentEnabled: false
      NewTabPageHideDefaultTopSites: true
      NewTabPagePrerenderEnabled: false
      NewTabPageQuickLinksEnabled: false
      NewTabPageManagedQuickLinks: false
      # PDF
      ShowAcrobatSubscriptionButton: false
      # Additional
      AlternateErrorPagesEnabled: false
      AutoImportAtFirstRun: 4
      BingAdsSuppression: true
      DefaultBrowserSettingsCampaignEnabled: false
      EdgeAssetDeliveryServiceEnabled: false
      EdgeAutofillMlEnabled: false
      EdgeEDropEnabled: false
      EdgeOpenInSidebarEnabled: false
      EdgeReadingModeServiceBasedExtractionEnabled: false
      EdgeSharedDeviceSupportEnabled: false
      EdgeShoppingAssistantEnabled: false
      ForceBingSafeSearch: 0
      HideFirstRunExperience: true
      HubsSidebarEnabled: false
      InAppSupportEnabled: false
      LocalBrowserDataShareEnabled: false
      MicrosoftEdgeInsiderPromotionEnabled: false
      MicrosoftEditorProofingEnabled: false
      MicrosoftEditorSynonymsEnabled: false
      NTPContentSuggestionsEnabled: false
      PersonalizeTopSitesInCustomizeSidebarEnabled: false
      PictureInPictureOverlayEnabled: false
      PinningWizardAllowed: false
      QuickSearchShowMiniMenu: false
      ReadAloudEnabled: false
      ResolveNavigationErrorsUseWebService: false
      SearchbarAllowed: false
      SearchbarIsEnabledOnStartup: false
      SearchForImageEnabled: false
      SearchInSidebarEnabled: 2
      SharedLinksEnabled: false
      ShowMicrosoftRewards: false
      ShowRecommendationsEnabled: false
      SpellcheckEnabled: false
      StandaloneHubsSidebarEnabled: false
      TabServicesEnabled: false
      TextPredictionEnabled: false
      TranslateEnabled: true
      UploadFromPhoneEnabled: false
      VisualSearchEnabled: false
  edgeDeprecated:
    label: Edge Deprecated
    targets: [ edge ]
    settings:
      AllowGamesMenu: false
      MicrosoftOfficeMenuEnabled: false
      ShowOfficeShortcutInFavoritesBar: false
      EdgeWalletEtreeEnabled: false
      PromotionalTabsEnabled: false
      WalletDonationEnabled: false
      WebWidgetAllowed: false
      EdgeSafeHostingExtensionEnabled: false
      EdgeWalletCheckoutEnabled: false
  edgeObsolete:
    label: Edge Obsolete (Safe To Remove)
    targets: [ edge ]
    visibility: onlyApplied
    settings:
      LinkedAccountEnabled: false
      AddressBarMicrosoftSearchInBingProviderEnabled: false
      GamerModeEnabled: false
      NewSmartScreenLibraryEnabled: false
      OutlookHubMenuEnabled: false
      ImmersiveReaderGrammarToolsEnabled: false
      ImmersiveReaderPictureDictionaryEnabled: false
      CryptoWalletEnabled: false
      EdgeEnhanceImagesEnabled: false
      EdgeFollowEnabled: false
      MathSolverEnabled: false
      EdgeCollectionsEnabled: false
      EdgeDiscoverEnabled: false
      LiveTranslationAllowed: false
  chromiumTelemetry:
    label: Chromium Telemetry
    targets: [ chrome, brave, edge, chromium ]
    settings:
      UserSecurityAuthenticatedReporting: false
      UserSecuritySignalsReporting: false
      MetricsReportingEnabled: false # obsolete in Edge
      FeedbackSurveysEnabled: false
      UserFeedbackAllowed: false
      SafeBrowsingSurveysEnabled: false
      DomainReliabilityAllowed: false
      UrlKeyedAnonymizedDataCollectionEnabled: false
      WebRtcEventLogCollectionAllowed: false
      WebRtcTextLogCollectionAllowed: false
  chromiumGenAI:
    label: Chromium Generative AI
    targets: [ chrome, brave, edge, chromium ]
    settings:
      AIModeSettings: 1
      AutofillGenAiSettings: 2
      AutofillPredictionSettings: 2 # deprecated
      ChromeSuggestionsSettings: 1
      CreateThemesSettings: 2
      DevToolsGenAiSettings: 2
      GeminiActOnWebSettings: 1
      GeminiChromeFileUploadSettings: 1
      GeminiSettings: 1
      GeminiSparkSettings: 1
      GenAILocalFoundationalModelSettings: 1
      GenAiDefaultSettings: 2
      HelpMeWriteSettings: 2
      SearchContentSharingSettings: 1
      SmartTabSharingSettings: 1
      TabCompareSettings: 2
      ThirdPartyAiChatSettings: 1
      TryOnYouSettings: 2
      VoiceTypingSettings: 2
      BuiltInAIAPIsEnabled: false
  chromiumSiteShield:
    label: Chromium Site-Shield
    targets: [ chrome, brave, edge, chromium ]
    settings:
      DefaultGeolocationSetting: 2
      DefaultLocalFontsSetting: 2
      DefaultNotificationsSetting: 2
      DefaultIdleDetectionSetting: 2
      PreciseGeolocationAllowedForUrls:
      - ""
  chromiumSiteShieldSensors:
    label: Chromium Site-Shield Sensors & Devices
    targets: [ chrome, brave, edge, chromium ]
    settings:
      DefaultSensorsSetting: 2
      DefaultSerialGuardSetting: 2
      DefaultWebBluetoothGuardSetting: 2
      DefaultWebHidGuardSetting: 2
      DefaultWebUsbGuardSetting: 2
  chromiumSignInSync:
    label: Chromium Sign-in and Sync
    targets: [ chrome, brave, edge, chromium ]
    settings:
      BrowserSignin: 0
      SyncDisabled: true
      SigninInterceptionEnabled: false
  chromiumPassword:
    label: Chromium Password Manager
    targets: [ chrome, brave, edge, chromium ]
    settings:
      PasswordManagerEnabled: true
      PasswordManagerPasskeysEnabled: true
      PasswordSharingEnabled: false
  chromiumMisc:
    label: Chromium Miscellaneous
    targets: [ chrome, brave, edge, chromium ]
    settings:
      # Network
      BuiltInDnsClientEnabled: false
      # DnsOverHttpsMode 'secure' needs DnsOverHttpsTemplates (and it turns on built-in DNS)
      # or make sure your system is using DoH or DoT
      DnsOverHttpsMode: automatic
      # Additional
      BackgroundModeEnabled: false
      BrowserGuestModeEnabled: true
      BrowserGuestModeEnforced: false
      BrowserLabsEnabled: false
      DefaultBrowserSettingEnabled: false
      DevToolsGoogleDeveloperProgramProfileAvailability: 2
      GoogleSearchSidePanelEnabled: false
      MediaRecommendationsEnabled: false
      NTPCardsVisible: false
      NTPFooterManagementNoticeEnabled: false
      ShoppingListEnabled: false
      SideSearchEnabled: false
      PromotionsEnabled: false
  chromiumObsolete:
    label: Chromium Obsolete (Safe To Remove)
    targets: [ chrome, brave, edge, chromium ]
    visibility: onlyApplied
    settings:
      # ChromeOS only
      DefaultSmartCardConnectSetting: 2
      GenAIInlineImageSettings: 2
      GenAIPhotoEditingSettings: 2
      GenAISmartGroupingSettings: 1 # allow grouping, but do not improve models
      GenAIVcBackgroundSettings: 2
      GenAIWallpaperSettings: 2
      HelpMeReadSettings: 2
      QuickAnswersDefinitionEnabled: false
      QuickAnswersEnabled: false
      QuickAnswersTranslationEnabled: false
      SuggestedContentEnabled: false
      # Removed from Chrome
      HistorySearchSettings: 2
      RelatedWebsiteSetsEnabled: false
      SafeBrowsingExtendedReportingEnabled: false
  yandexExt:
    label: Yandex Extensions
    targets: [ yandex ]
    settings:
      ExtensionInstallForcelist: []
  yandexTelemetry:
    label: Yandex Telemetry
    targets: [ yandex ]
    settings:
      BrowserNetworkTimeQueriesEnabled: false
      CrashesReporting: false
      SafeBrowsingExtendedReportingEnabled: false
      SpellCheckServiceEnabled: false
      StatisticsReporting: false
      YandexCloudLanguageDetectEnabled: false
  yandexGenAI:
    label: Yandex AI
    targets: [ yandex ]
    settings:
      NeuroNtpTools: false
      NeuroQuestionEnabled: false
      YandexAliceMsgDisable: true
      YandexImageDescriberButtonEnabled: false
      YandexNeuroEdit: false
      YandexSummarizationDisable: true
      YandexVideoSummarization: false
  yandexFeatures:
    label: Yandex Features
    targets: [ yandex ]
    settings:
      AlternateErrorPagesEnabled: false
      CloudDocumentsDisabled: true
      Education: false
      EnableBackgroundAnimationHighResolution: false
      EnableSearchByImageInSystemMenu: false
      FastSignup: false
      NtpNotificationsDisable: true
      SidePanelMode: 2
      WebGalleryRotation: false
      WelcomeExperiments: false
      YandexButtonDisable: true
      YandexCopyShareButton: false
      YandexEcomEnabled: false
      YandexShowWebReviews: false
      YandexTranslateVideosButton: false
      YandexVideoQR: false
  yandexSiteShield:
    label: Yandex Site-Shield
    targets: [ yandex ]
    settings:
      DefaultGeolocationSetting: 2
      DefaultLocalFontsSetting: 2
      DefaultNotificationsSetting: 2
  yandexSiteShieldSensors:
    label: Yandex Site-Shield Sensors & Devices
    targets: [ yandex ]
    settings:
      DefaultSensorsSetting: 2
      DefaultSerialGuardSetting: 2
      DefaultWebBluetoothGuardSetting: 2
      DefaultWebHidGuardSetting: 2
      DefaultWebUsbGuardSetting: 2
  yandexSignInSync:
    label: Yandex Sign-in and Sync
    targets: [ yandex ]
    settings:
      YandexDisableID: true
      YandexSyncEnabled: false
  yandexPassword:
    label: Yandex Password Manager
    targets: [ yandex ]
    settings:
      PasswordManagerEnabled: true
  yandexMisc:
    label: Yandex Miscellaneous
    targets: [ yandex ]
    settings:
      BackgroundModeEnabled: false
      ChromeVariations: 1
      DefaultBrowserSettingEnabled: false
      DnsOverHttpsMode: automatic

extensions:
  ublock:
    name: uBlock Origin
    id: cjpalhdlnbpafiamejdnhcphjbkeiagm
    targets: [ ] # Manifest v2 no longer supported
  ublockLite:
    name: uBlock Origin Lite
    id: ddkjiahejlhfcafbddmgiahcphecmpfh
    targets: [ chrome, brave, yandex, chromium ]
  isdcac:
    name: I still don't care about cookies
    id: edibdbjcniadpccecjdfdjjppcpchdlm
    targets: [ chrome, brave, yandex, chromium ]
  cad:
    name: Cookie AutoDelete
    id: fhcgjolkccmbidfldomjliifgaodjagh
    targets: [ ] # Manifest v2 no longer supported
  ublockLiteEdge:
    name: uBlock Origin Lite [Edge Addons Store]
    id: cimighlppcgcoapaliogpjjdehbnofhn
    targets: [ edge ]
  ublockEdge:
    name: uBlock Origin [Edge Addons Store]
    id: odfafepnkmbhccpbejgmiehpchacaeak
    targets: [ edge ]
  isdcacEdge:
    name: I still don't care about cookies [Edge Addons Store]
    id: kkacdgacpkediooahopgcbdahlpipheh
    targets: [ edge ]
  blankTabEdge:
    name: Blank Tab [Edge Addons Store]
    id: ihknoknoahjhldmpdoajjdkfjhddgpcd
    targets: [ edge ]
# presets enables the declared policy groups
presets:
  brave:
    balanced:
      policyGroups:
      - braveTelemetry
      - braveFeatures
      - chromiumTelemetry
      - chromiumGenAI
      - chromiumSiteShield
      - chromiumSignInSync
      - chromiumMisc
      extensions:
      - ublockLite
      - isdcac
  chrome:
    balanced:
      policyGroups:
      - chromiumTelemetry
      - chromiumGenAI
      - chromiumSiteShield
      - chromiumSignInSync
      - chromiumMisc
      extensions:
      - ublockLite
      - isdcac
  chromium:
    balanced:
      policyGroups:
      - chromiumTelemetry
      - chromiumGenAI
      - chromiumSiteShield
      - chromiumSignInSync
      - chromiumMisc
      extensions:
      - ublockLite
      - isdcac
  edge:
    balanced:
      policyGroups:
      - edgeTelemetry
      - edgeSignIn
      - edgeGenAI
      - edgeFeatures
      - edgeDeprecated
      - chromiumTelemetry
      - chromiumGenAI
      - chromiumSiteShield
      - chromiumSignInSync
      - chromiumMisc
      extensions:
      - ublockLiteEdge
      - isdcacEdge
      - blankTabEdge
  yandex:
    balanced:
      policyGroups:
      - yandexExt
      - yandexTelemetry
      - yandexGenAI
      - yandexFeatures
      - yandexSiteShield
      - yandexSiteShieldSensors
      - yandexSignInSync
      - yandexPassword
      - yandexMisc
      extensions:
      - ublockLite
      - isdcac
