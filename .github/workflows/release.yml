name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to release
        type: choice
        required: true
        default: patch
        options:
        - patch
        - minor
        - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Checks
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/check.yml
    with:
      skip-binaries: true

  version:
    name: Bump Version
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Rust and cargo-release
      uses: taiki-e/install-action@v2
      with:
        tool: rust@1.100.0,cargo-release

    - name: Bump version
      id: bump
      env:
        BUMP: ${{ inputs.bump }}
      run: |
        cargo release version "$BUMP" --execute --no-confirm
        version="$(cargo metadata --no-deps --format-version 1 \
          | jq -er '.packages[] | select(.name == "chrome-debloat") | .version')"

        if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
          echo "Tag v$version already exists." >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Upload version files
      uses: actions/upload-artifact@v4
      with:
        name: version-files
        path: |
          Cargo.toml
          Cargo.lock
        if-no-files-found: error
        retention-days: 1

  build:
    name: Build (${{ matrix.label }})
    needs: version
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          label: Linux x64
          asset: chrome-debloat-linux-x86_64.tar.gz
        - os: ubuntu-24.04-arm
          label: Linux arm64
          asset: chrome-debloat-linux-aarch64.tar.gz
        - os: macos-15-intel
          label: macOS x64
          asset: chrome-debloat-macos-x86_64.tar.gz
        - os: macos-latest
          label: macOS arm64
          asset: chrome-debloat-macos-aarch64.tar.gz
        - os: windows-latest
          label: Windows x64
          asset: chrome-debloat-windows-x86_64.zip
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Apply version bump
      uses: actions/download-artifact@v4
      with:
        name: version-files

    - name: Install Rust
      uses: taiki-e/install-action@v2
      with:
        tool: rust@1.100.0

    - name: Build
      env:
        APP_RELEASE: '1'
      run: cargo +1.100.0 build --release --locked

    - name: Package tarball
      if: runner.os != 'Windows'
      run: tar -czf "${{ matrix.asset }}" -C target/release chrome-debloat

    - name: Package zip
      if: runner.os == 'Windows'
      shell: pwsh
      run: Compress-Archive -Path target/release/chrome-debloat.exe -DestinationPath "${{ matrix.asset }}"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: asset-${{ matrix.asset }}
        path: ${{ matrix.asset }}
        if-no-files-found: error
        retention-days: 1

  publish:
    name: Publish
    needs:
    - version
    - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Apply version bump
      uses: actions/download-artifact@v4
      with:
        name: version-files

    - name: Download assets
      uses: actions/download-artifact@v4
      with:
        pattern: asset-*
        path: dist
        merge-multiple: true

    - name: Generate checksums
      working-directory: dist
      run: for f in *; do sha256sum "$f" > "$f.sha256"; done

    - name: Push release commit and tag
      run: |
        if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
          echo "$TAG already pushed."
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -am "chore: Release chrome-debloat version ${TAG#v}"
        git tag -a "$TAG" -m "Release $TAG"
        # Rejected if main moved since checks ran.
        git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"

    - name: Create GitHub release
      run: gh release create "$TAG" dist/* --verify-tag --generate-notes
