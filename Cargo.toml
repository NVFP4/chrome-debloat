[package]
name = "chrome-debloat"
version = "0.3.1-alpha.1"
edition = "2024"
repository = "https://github.com/NVFP4/chrome-debloat"

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
flate2 = "1.1.10"
indexmap = { version = "2.14.2", features = ["serde"] }
mimalloc = "0.1.52"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
tempfile = "3.27.0"
thiserror = "2.0.20"

[build-dependencies]
flate2 = "1.1.9"
serde_yaml = "0.9.34"

[target.'cfg(target_os = "linux")'.dependencies]
serde_json = "1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
notify = "8.2.0"
plist = "1.10.1"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4.1"
windows-registry = "0.100.0"

[profile.release]
opt-level = 2
debug = false
strip = true
overflow-checks = true
lto = "fat"
